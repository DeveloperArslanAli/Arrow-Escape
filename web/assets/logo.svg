<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryArrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="accentArrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="goldArrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4" fill="none" />

  <!-- Grid Blueprint Accents -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 6">
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="384" x2="448" y2="384" />
  </g>

  <!-- Central Dynamic Arrow 1: Main Upward Escaping Arrow (Cyan/Blue) -->
  <g filter="url(#glow)">
    <!-- Arrow Body Polyline -->
    <path d="M 256 384 L 256 160" stroke="url(#primaryArrow)" stroke-width="32" stroke-linecap="round" />
    <!-- Arrowhead -->
    <path d="M 200 200 L 256 128 L 312 200" stroke="url(#primaryArrow)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Arrow 2: Interlocking Right Arrow (Coral Pink) -->
  <g opacity="0.9">
    <path d="M 128 256 L 360 256" stroke="url(#accentArrow)" stroke-width="24" stroke-linecap="round" />
    <path d="M 324 216 L 380 256 L 324 296" stroke="url(#accentArrow)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Arrow 3: Winding Turn Arrow (Gold/Amber) -->
  <g opacity="0.85">
    <path d="M 160 360 L 160 200 L 220 200" stroke="url(#goldArrow)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 200 180 L 236 200 L 200 220" stroke="url(#goldArrow)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="216" stroke="url(#primaryArrow)" stroke-width="2" stroke-dasharray="16 24" opacity="0.4" />
</svg>
